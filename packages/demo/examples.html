<html lang="en">
<head>

<title>Isoform — five real architectures</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0E1116; color: #E7EBF2;
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 20px 80px; }
  h1 { font-size: 19px; letter-spacing: -.01em; margin: 0 0 6px; }

  h2 { font-size: 15px; margin: 0 0 2px; }
  .src { font-size: 12px; color: #5F6A7B; margin: 0 0 6px; }

  pre { color: #5F6A7B; font-size: 11.5px; }
  button { font: inherit; background: transparent; color: #D9AE6B; border: 1px solid #8A6F42;

<body>
<h1>Five real architectures, rebuilt</h1>
<p class="lede">
  Each is a recreation of a published design, written in the library's text
  format and rendered by it. The point is to find what the library cannot say —
  a diagram invented to suit it would never find that out.
</p>
<button id="save">Download all</button>
<pre id="log"></pre>
<div id="out"></div>
