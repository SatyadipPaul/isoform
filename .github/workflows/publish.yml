name: Publish to npm

# Publishing is tied to a GitHub Release rather than to a push. A tag is a
# deliberate act; a push to main is not, and npm versions cannot be reused or
# meaningfully withdrawn once they are out.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The whole point of trusted publishing. GitHub mints a short-lived OIDC
      # token for this specific workflow in this specific repository, and npm
      # verifies it against the trusted publisher configured on the package.
      # No npm token is stored anywhere — not in secrets, not on a laptop — so
      # there is nothing to leak, rotate, or lose.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node ships npm 10.x; OIDC publishing needs 11.5.1 or newer.
      # Without this the publish falls back to looking for a token and fails
      # with a confusing auth error rather than an obvious version one.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      # `npm install`, not `npm ci`.
      #
      # `npm ci` demands the lockfile satisfy the tree exactly, and a lockfile
      # written on one OS cannot always do that on another: rolldown ships a
      # native binding per platform, and those pull different `@emnapi`
      # versions. Authored on Windows, this lockfile made CI fail with
      # "Missing: @emnapi/core@1.11.3 from lock file"; regenerating it to suit
      # Linux then broke `npm ci` on Windows the same way.
      #
      # `npm install` honours the lockfile for everything it can resolve and
      # fills in the platform-specific optionals instead of failing. The cost is
      # real — a transitive version could drift here without the lockfile
      # changing — and it is the smaller cost than a build that cannot run.
      - run: npm install

      # The same gates as CI. A release should not be the first time these run,
      # but it should be the last time they can stop a bad publish.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

      # `--provenance` attaches a signed statement linking the tarball to this
      # commit and workflow. npm shows it as a "Built and signed" badge, which
      # is the visible half of what trusted publishing buys.
      #
      # Two auth modes, and which one runs depends only on whether the NPM_TOKEN
      # secret exists.
      #
      # BOOTSTRAP (first publish only). Trusted publishing is configured on a
      # package's settings page, and a package that has never been published has
      # no settings page — the first OIDC attempt failed with
      # "404 The requested resource 'isoform@0.3.0' could not be found".
      # So the name has to be claimed once with a token.
      #
      # STEADY STATE. Once the package exists and the repository is registered
      # as its trusted publisher, delete the NPM_TOKEN secret. npm then falls
      # back to the OIDC credential minted above, and there is no long-lived
      # token anywhere — which is the whole point, and is mandatory from
      # January 2027 when bypass tokens stop working for publishing.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::Publishing with NPM_TOKEN (bootstrap). Delete the secret once trusted publishing is configured."
          else
            echo "::notice::Publishing via OIDC trusted publishing — no stored token."
          fi
          npm publish -w isoform --provenance --access public
