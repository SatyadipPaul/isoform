name: Publish to npm

# Publishing is tied to a GitHub Release rather than to a push. A tag is a
# deliberate act; a push to main is not, and npm versions cannot be reused or
# meaningfully withdrawn once they are out.
on:
  # A version tag is the release. Pushing `v0.3.1` publishes 0.3.1 — one
  # deterministic command, no dialog to click, and the tag is a durable record
  # of exactly which commit went out.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The whole point of trusted publishing. GitHub mints a short-lived OIDC
      # token for this specific workflow in this specific repository, and npm
      # verifies it against the trusted publisher configured on the package.
      # No npm token is stored anywhere — not in secrets, not on a laptop — so
      # there is nothing to leak, rotate, or lose.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node ships npm 10.x; OIDC publishing needs 11.5.1 or newer.
      # Without this the publish falls back to looking for a token and fails
      # with a confusing auth error rather than an obvious version one.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      # `npm install`, not `npm ci`.
      #
      # `npm ci` demands the lockfile satisfy the tree exactly, and a lockfile
      # written on one OS cannot always do that on another: rolldown ships a
      # native binding per platform, and those pull different `@emnapi`
      # versions. Authored on Windows, this lockfile made CI fail with
      # "Missing: @emnapi/core@1.11.3 from lock file"; regenerating it to suit
      # Linux then broke `npm ci` on Windows the same way.
      #
      # `npm install` honours the lockfile for everything it can resolve and
      # fills in the platform-specific optionals instead of failing. The cost is
      # real — a transitive version could drift here without the lockfile
      # changing — and it is the smaller cost than a build that cannot run.
      - run: npm install

      # The same gates as CI. A release should not be the first time these run,
      # but it should be the last time they can stop a bad publish.
      - run: npm run typecheck
      # The HTML export's tests skip themselves without this, and a release is
      # the last place to discover the export ships an empty runtime.
      - run: npm run build:runtime
      - run: npm test
      - run: npm run build:lib

      # `--provenance` attaches a signed statement linking the tarball to this
      # commit and workflow. npm shows it as a "Built and signed" badge.
      #
      # OIDC IS THE DEFAULT, AND THE PRESENCE OF A SECRET NO LONGER CHANGES THAT.
      # It used to: the step took the token branch whenever NPM_TOKEN existed, so
      # once that token expired — or fell under npm's restriction on tokens that
      # bypass 2FA — every release failed with a masked `404 ... could not be
      # found or you do not have permission`, while trusted publishing sat
      # configured and untried. A credential that silently wins over the one you
      # meant to use is worse than no credential.
      #
      # To go back to the token deliberately, set the repository *variable*
      # USE_NPM_TOKEN to "true". A variable, not a secret, so the choice is
      # visible in the settings UI rather than inferred from what exists.
      - name: Publish
        env:
          # Deliberately not NODE_AUTH_TOKEN. Naming it that would let the
          # .npmrc `setup-node` wrote pick it up automatically, which is the
          # behaviour being removed here.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          USE_TOKEN: ${{ vars.USE_NPM_TOKEN }}
        run: |
          npm --version
          if [ "$USE_TOKEN" = "true" ] && [ -n "$NPM_TOKEN" ]; then
            echo "::notice::Publishing with NPM_TOKEN, because the USE_NPM_TOKEN variable asks for it."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "::notice::Publishing via OIDC trusted publishing."
            # `setup-node` with `registry-url` writes an .npmrc line reading
            #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
            # Leaving it in place makes npm authenticate as whoever that token
            # is, so the OIDC claim is never presented.
            for f in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
              if [ -n "$f" ] && [ -f "$f" ]; then
                sed -i '/_authToken/d' "$f"
                echo "cleared the token line from $f"
              fi
            done
            # Say whether the OIDC machinery is even available, so a failure
            # here distinguishes "GitHub minted no token" from "npm refused the
            # one it got". Without this the log says only ENEEDAUTH, which reads
            # identically for both and sent this round in circles.
            if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
              echo "OIDC token endpoint present — id-token: write is in effect."
              echo "If this still fails with ENEEDAUTH, npm has no trusted publisher"
              echo "registered for @satyadip28/isoform pointing at this repo and publish.yml."
            else
              echo "::error::No OIDC token endpoint. id-token: write is missing or the job cannot mint one."
            fi
          fi
          npm publish -w @satyadip28/isoform --provenance --access public
