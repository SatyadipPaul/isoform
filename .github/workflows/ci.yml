name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`.
      #
      # `npm ci` demands the lockfile satisfy the tree exactly, and a lockfile
      # written on one OS cannot always do that on another: rolldown ships a
      # native binding per platform, and those pull different `@emnapi`
      # versions. Authored on Windows, this lockfile made CI fail with
      # "Missing: @emnapi/core@1.11.3 from lock file"; regenerating it to suit
      # Linux then broke `npm ci` on Windows the same way.
      #
      # `npm install` honours the lockfile for everything it can resolve and
      # fills in the platform-specific optionals instead of failing. The cost is
      # real — a transitive version could drift here without the lockfile
      # changing — and it is the smaller cost than a build that cannot run.
      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds the library and then the demo. Catches the case where sources
      # typecheck but the emitted package is broken — the two are not the same
      # check, because `exports` points at built output rather than at src.
      - name: Build
        run: npm run build

      # A packaging regression is invisible until someone installs it: a stale
      # `files` list, an exports map pointing at something that was not emitted,
      # a missing LICENSE. Packing on every push surfaces that here instead.
      - name: Pack
        run: npm pack -w @satyadip28/isoform --dry-run
